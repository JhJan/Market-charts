<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradingView - GBPUSD</title>
  <style>
    /* Reset y contenedor principal */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #widget-container {
      height: 100vh;
      width: 100vw;
      position: relative;
    }
    /* Panel de control flotante */
    .control-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 16px 20px;
      color: #e0e7ef;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 200px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      user-select: none;
    }
    .control-panel .title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #94a3b8;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 8px;
      margin-bottom: 4px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .control-row label {
      font-size: 13px;
      color: #cbd5e1;
      white-space: nowrap;
    }
    .control-row input {
      width: 64px;
      padding: 4px 6px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f1f5f9;
      font-size: 13px;
      text-align: center;
      transition: border-color 0.2s;
    }
    .control-row input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .control-row input[type="color"] {
      width: 32px;
      height: 32px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
    }
    .btn-update {
      background: #2563eb;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      font-size: 14px;
      padding: 8px 0;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }
    .btn-update:hover {
      background: #1d4ed8;
    }
    .btn-update:active {
      transform: scale(0.97);
    }
    /* Adaptación para móviles */
    @media (max-width: 600px) {
      .control-panel {
        top: 12px;
        right: 12px;
        padding: 12px 14px;
        min-width: 160px;
      }
      .control-row input {
        width: 50px;
      }
    }
  </style>
</head>
<body>
  <div id="widget-container">
    <!-- Panel de control -->
    <div class="control-panel">
      <div class="title">⚙️ EMAs</div>
      <div class="control-row">
        <label>EMA 1</label>
        <input type="number" id="ema1-period" value="50" min="1" max="500" step="1">
      </div>
      <div class="control-row">
        <label>EMA 2</label>
        <input type="number" id="ema2-period" value="200" min="1" max="500" step="1">
      </div>
      <button class="btn-update" id="update-btn">Actualizar gráfico</button>
    </div>

    <!-- Contenedor del widget -->
    <div class="tradingview-widget-container" style="height:100%;width:100%">
      <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
      <div class="tradingview-widget-copyright">
        <a href="https://es.tradingview.com/symbols/GBPUSD/?exchange=VANTAGE" rel="noopener nofollow" target="_blank">
          <span class="blue-text">Track all markets on TradingView</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // Configuración base del widget (se mantienen todos los parámetros)
      function buildWidgetConfig(ema1Length, ema2Length) {
        return {
          "allow_symbol_change": true,
          "calendar": false,
          "details": false,
          "hide_side_toolbar": true,
          "hide_top_toolbar": false,
          "hide_legend": false,
          "hide_volume": false,
          "hotlist": false,
          "interval": "W",
          "locale": "es",
          "save_image": true,
          "style": "1",
          "symbol": "VANTAGE:GBPUSD",
          "theme": "dark",
          "timezone": "America/New_York",
          "backgroundColor": "rgba(11, 15, 25, 1)",
          "gridColor": "rgba(30, 41, 59, 0.3)",
          "watchlist": [],
          "withdateranges": false,
          "compareSymbols": [],
          "support_host": "https://www.tradingview.com",
          "studies": [
            "STD;EMA",
            "STD;EMA",
            "STD;Momentum",
            "STD;RSI"
          ],
          "studies_overrides": {
            "moving average exponential.length": ema1Length,
            "moving average exponential.plot.color": "#00BFFF",
            "moving average exponential.plot.linewidth": 1,
            "moving average exponential:1.length": ema2Length,
            "moving average exponential:1.plot.color": "#FFFFFF",
            "moving average exponential:1.plot.linewidth": 2
          },
          "autosize": true
        };
      }

      // Referencias
      const container = document.querySelector('.tradingview-widget-container');
      const widgetDiv = container.querySelector('.tradingview-widget-container__widget');
      const ema1Input = document.getElementById('ema1-period');
      const ema2Input = document.getElementById('ema2-period');
      const updateBtn = document.getElementById('update-btn');

      // Función para cargar el widget con la configuración actual
      function loadWidget(ema1, ema2) {
        // Eliminar el script anterior si existe
        const oldScript = container.querySelector('script[src*="embed-widget-advanced-chart.js"]');
        if (oldScript) {
          oldScript.remove();
        }

        // Crear nuevo script
        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
        script.async = true;
        // Los parámetros se pasan como texto JSON en el contenido del script (no como atributo)
        script.textContent = JSON.stringify(buildWidgetConfig(ema1, ema2));
        container.appendChild(script);
      }

      // Carga inicial con valores por defecto (50 y 200)
      loadWidget(50, 200);

      // Evento del botón actualizar
      updateBtn.addEventListener('click', function() {
        let ema1 = parseInt(ema1Input.value, 10);
        let ema2 = parseInt(ema2Input.value, 10);
        // Validación básica
        if (isNaN(ema1) || ema1 < 1) ema1 = 50;
        if (isNaN(ema2) || ema2 < 1) ema2 = 200;
        ema1Input.value = ema1;
        ema2Input.value = ema2;
        loadWidget(ema1, ema2);
      });

      // Permitir actualizar con Enter en los inputs
      [ema1Input, ema2Input].forEach(input => {
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            updateBtn.click();
          }
        });
      });
    })();
  </script>
</body>
</html>
