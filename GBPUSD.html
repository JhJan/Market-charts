<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradingView - GBPUSD</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
    }
    .tradingview-widget-container {
      height: 100vh;
      width: 100vw;
    }
  </style>
</head>
<body>
  <div class="tradingview-widget-container" style="height:100%;width:100%">
    <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
    <div class="tradingview-widget-copyright"><a href="https://es.tradingview.com/symbols/GBPUSD/?exchange=VANTAGE" rel="noopener nofollow" target="_blank"><span class="blue-text">Track all markets on TradingView</span></a></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
    {
      "allow_symbol_change": true,
      "calendar": false,
      "details": false,
      "hide_side_toolbar": false,
      "hide_top_toolbar": false,
      "hide_legend": false,
      "hide_volume": false,
      "hotlist": false,
      "interval": "W",
      "locale": "es",
      "save_image": true,
      "style": "1",
      "symbol": "VANTAGE:GBPUSD",
      "theme": "dark",
      "timezone": "America/New_York",
      "backgroundColor": "rgba(11, 15, 25, 1)",
      "gridColor": "rgba(30, 41, 59, 0.3)",
      "watchlist": [],
      "withdateranges": true,
      "compareSymbols": [],
      "support_host": "https://www.tradingview.com",
      "studies": [
        "STD;EMA",
        "STD;EMA",
        "STD;Momentum",
        "STD;RSI"
      ],
      "studies_overrides": {
        "moving average exponential.length": 50,
        "moving average exponential.plot.color": "#00BFFF",
        "moving average exponential.plot.linewidth": 1,
        "moving average exponential$1.length": 200,
        "moving average exponential$1.plot.color": "#FFFFFF",
        "moving average exponential$1.plot.linewidth": 2
      },
      "autosize": true
    }
    </script>
  </div>
  </body>
</html>
